[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.1",
    "transformers>=4.44.2",
    "ruff>=0.6.3",
    "ipython>=8.27.0",
    "jaxtyping>=0.2.34",
    "equinox>=0.11.5",
    "beartype>=0.18.5",
    "jax-metal>=0.1.0",
    "einops>=0.8.0",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# Disable fix for unused imports.
unfixable = ["F401"]
ignore = [
  "F722", # forward-annotation-syntax-error, because of Jaxtyping
]